<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>개인정보 처리 — 내버스시간표</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="bus-app">
    <div class="wrap bus-wrap">
      <h1 class="app-name">내버스시간표</h1>
      <p class="app-guide">
        이 페이지는 구글 로그인·앱 등록 시 필요한 <strong>개인정보 처리 안내</strong>입니다.
      </p>
      <section class="panel-lite" style="padding: 1rem 1.1rem; text-align: left; line-height: 1.55">
        <h2 style="font-size: 1.25rem; margin: 0 0 0.75rem">수집·이용</h2>
        <ul style="margin: 0; padding-left: 1.2rem">
          <li>로그인 시: Google이 제공하는 계정 정보(이메일, 이름 등)</li>
          <li>앱 사용 시: 정류장 이름, 시간표 사진, 사진 애칭 (로그인한 경우 클라우드 저장)</li>
        </ul>
        <h2 style="font-size: 1.25rem; margin: 1.25rem 0 0.75rem">보관</h2>
        <p style="margin: 0">
          로그인한 데이터는 Supabase(클라우드)에 본인 계정으로만 저장됩니다. 로그인하지 않으면
          해당 휴대폰에만 저장됩니다.
        </p>
        <h2 style="font-size: 1.25rem; margin: 1.25rem 0 0.75rem">문의</h2>
        <p style="margin: 0">앱 운영자에게 문의해 주세요.</p>
      </section>
      <p style="margin-top: 1.25rem; text-align: center">
        <a href="./" class="big-btn secondary" style="display: inline-block; text-decoration: none"
          >앱으로 돌아가기</a
        >
      </p>
    </div>
  </body>
</html>
