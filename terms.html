<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이용 안내 — 내버스시간표</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="bus-app">
    <div class="wrap bus-wrap">
      <h1 class="app-name">내버스시간표</h1>
      <p class="app-guide">앱 이용에 관한 <strong>간단한 안내</strong>입니다.</p>
      <section class="panel-lite" style="padding: 1rem 1.1rem; text-align: left; line-height: 1.55">
        <p style="margin: 0 0 1rem">
          내버스시간표는 정류장 시간표 사진을 저장·보는 웹 앱입니다. 구글 로그인은 선택 사항이며,
          클라우드 보관에만 사용됩니다.
        </p>
        <p style="margin: 0">
          서비스는 현재 상태 그대로 제공됩니다. 문의는 앱 운영자에게 연락해 주세요.
        </p>
      </section>
      <p style="margin-top: 1.25rem; text-align: center">
        <a href="./" class="big-btn secondary" style="display: inline-block; text-decoration: none"
          >앱으로 돌아가기</a
        >
      </p>
    </div>
  </body>
</html>
